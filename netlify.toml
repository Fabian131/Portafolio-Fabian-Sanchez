[[headers]]
  for = "/*"
  [headers.values]
    # No cachear el HTML (index.html) para asegurar que los usuarios siempre obtengan la última versión de los assets
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Los archivos generados por Vite (JS y CSS) tienen hashes únicos, por lo que se pueden cachear por 1 año
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    # Las fuentes no cambian, cachear por 1 año
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    # Las imágenes no cambian frecuentemente, cachear por 1 año
    Cache-Control = "public, max-age=31536000, immutable"
